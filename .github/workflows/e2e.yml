name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /var/lib/docker
          key: ddev-docker-${{ runner.os }}-${{ hashFiles('.ddev/config.yaml') }}
          restore-keys: ddev-docker-${{ runner.os }}-

      - name: Setup DDEV
        uses: ddev/setup-ddev@v1

      - name: Start DDEV
        run: ddev start

      - name: Install PHP dependencies
        run: ddev composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: ddev exec bash scripts/run-e2e.sh

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
